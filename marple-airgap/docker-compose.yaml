# Resource limits and worker counts come from .env; append a profile from
# ../profiles/ when creating .env (see .env.example and ../profiles/README.md).

# Shared by the marple-db (web) and marple-db-worker services so their config cannot drift.
x-mdb-environment: &mdb-environment
  MDB_DEPLOYMENT: $DEPLOYMENT
  MDB_LOG_SHOULD_UPLOAD: $LOG_SHOULD_UPLOAD
  MDB_LICENSING_SERVER_ENABLED: $LICENSING_SERVER_ENABLED
  MDB_DB_HOST: $POSTGRES_HOST
  MDB_DB_PORT: $POSTGRES_PORT
  MDB_DB_NAME: $POSTGRES_DB
  MDB_DB_USER: $POSTGRES_USER
  MDB_DB_PASSWORD: $POSTGRES_PASSWORD
  MDB_IDP_PROVIDER: $IDP_PROVIDER
  MDB_OIDC_DOMAIN: $OIDC_DOMAIN
  MDB_OIDC_CLIENT: $OIDC_CLIENT
  MDB_OIDC_AUDIENCE: $OIDC_AUDIENCE
  MDB_OIDC_SCOPE: $OIDC_SCOPE

# The worker must see the same uploads / scratch as the web container.
x-mdb-volumes: &mdb-volumes
  - ${COMPOSE_PATH_ROOT}/db:/srv/marpledb
  - ${COMPOSE_PATH_ROOT}/swap/imports:/srv/marpledb/swap

# Shared by the marple-insight (web) and marple-insight-queue services so their config cannot drift.
x-insight-environment: &insight-environment
  MARPLE_DEPLOYMENT: $DEPLOYMENT
  MARPLE_LOG_SHOULD_UPLOAD: $LOG_SHOULD_UPLOAD
  MARPLE_LICENSING_SERVER_ENABLED: $LICENSING_SERVER_ENABLED
  MARPLE_POSTGRES_HOST: $POSTGRES_HOST
  MARPLE_POSTGRES_PORT: $POSTGRES_PORT
  MARPLE_POSTGRES_DB_NAME: $POSTGRES_DB
  MARPLE_POSTGRES_USER: $POSTGRES_USER
  MARPLE_POSTGRES_PW: $POSTGRES_PASSWORD
  MARPLE_AUTH_PROVIDER: $IDP_PROVIDER
  MARPLE_OAUTH_DOMAIN: $OIDC_DOMAIN
  MARPLE_OAUTH_ISSUER: $OIDC_ISSUER
  MARPLE_OAUTH_APP_CLIENT_ID: $OIDC_CLIENT
  MARPLE_OAUTH_API_AUDIENCE: $OIDC_AUDIENCE
  MARPLE_OAUTH_SCOPE: $OIDC_SCOPE

# The queue writes exported files under PATH_ROOT/exports; the web container serves them back.
x-insight-volumes: &insight-volumes
  - ${COMPOSE_PATH_ROOT}/insight:/srv/marple
  - ${COMPOSE_PATH_ROOT}/swap/exports:/srv/marple/exports

services:
  marple-postgres:
    container_name: marple-postgres
    env_file:
      - .env
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:18-alpine
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - ${COMPOSE_PATH_ROOT}/postgres:/var/lib/postgresql
    restart: unless-stopped

  marple-garage:
    image: dxflrs/garage:v2.1.0
    container_name: marple-garage
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ${COMPOSE_PATH_ROOT}/garage/data:/var/lib/garage/data
      - ${COMPOSE_PATH_ROOT}/garage/meta:/var/lib/garage/meta
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD", "/garage", "status"]
      timeout: 5s
    restart: unless-stopped

  marple-insight:
    container_name: marple-insight
    image: docker.marpledata.com/library/marple-insight:${VERSION_INSIGHT:-3.8.0}
    env_file:
      - .env
    environment: *insight-environment
    ports:
      - ${COMPOSE_PORT_INSIGHT:-80}:80 # first port is host
    volumes: *insight-volumes
    depends_on:
      - marple-postgres
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MARPLE_CPU_LIMIT:-0}"
          memory: "${MARPLE_MEM_LIMIT:-0}"

  marple-insight-queue:
    container_name: marple-insight-queue
    image: docker.marpledata.com/library/marple-insight:${VERSION_INSIGHT:-3.8.0}
    env_file:
      - .env
    environment: *insight-environment
    working_dir: /marple-core
    entrypoint: []
    command: ["poetry", "run", "python", "queue_worker.py"]
    # Share the web container's network so report/figure exports can reach it on localhost.
    network_mode: "service:marple-insight"
    volumes: *insight-volumes
    depends_on:
      - marple-insight
    restart: unless-stopped
    deploy:
      # The queue runs one worker process; concurrency is set by MARPLE_PROCRASTINATE_WORKERS.
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MARPLE_QUEUE_CPU_LIMIT:-0}"
          memory: "${MARPLE_QUEUE_MEM_LIMIT:-0}"

  marple-db:
    container_name: marple-db
    image: docker.marpledata.com/library/marple-db:${VERSION_DB:-3.8.0}
    command: ["./start.sh", "web"]
    init: true
    env_file:
      - .env
    environment: *mdb-environment
    ports:
      - ${COMPOSE_PORT_DB:-8000}:80 # first port is host
    volumes: *mdb-volumes
    depends_on:
      - marple-postgres
      - marple-garage
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MDB_CPU_LIMIT:-0}"
          memory: "${MDB_MEM_LIMIT:-0}"

  marple-db-worker:
    container_name: marple-db-worker
    image: docker.marpledata.com/library/marple-db:${VERSION_DB:-3.8.0}
    command: ["./start.sh", "worker"]
    init: true
    env_file:
      - .env
    environment: *mdb-environment
    volumes: *mdb-volumes
    depends_on:
      marple-postgres:
        condition: service_healthy
      marple-garage:
        condition: service_healthy
      marple-db:
        condition: service_started
      marple-trino:
        condition: service_started
    restart: unless-stopped
    deploy:
      # The queue startup-reset assumes one worker process per queue; do not scale this out.
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MDB_WORKER_CPU_LIMIT:-0}"
          memory: "${MDB_WORKER_MEM_LIMIT:-0}"

  marple-trino:
    container_name: marple-trino
    # Keep this pinned to the SPI version used by marpledb-trino-auth (see marpledb-trino-auth/pom.xml)
    image: trinodb/trino:479
    ports:
      - ${COMPOSE_PORT_TRINO:-9003}:8080
    env_file:
      - .env
    environment:
      CATALOG_MANAGEMENT: dynamic
    volumes:
      # Airgap uses a minimal static config (no password auth). See trino/config.properties.
      - ./trino/config.properties:/etc/trino/config.properties:ro
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${TRINO_CPU_LIMIT:-0}"
          memory: "${TRINO_MEM_LIMIT:-0}"
