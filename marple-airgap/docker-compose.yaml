# Resource limits and worker counts come from .env; append a profile from
# ../profiles/ when creating .env (see .env.example and ../profiles/README.md).
# NOTE: marple-db runs ./start.sh all (API + workers in one container), so give
# MDB_MEM_LIMIT the combined budget; MDB_WORKER_* limits do not apply here.
services:
  marple-postgres:
    container_name: marple-postgres
    env_file:
      - .env
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:18-alpine
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - ${COMPOSE_PATH_ROOT}/postgres:/var/lib/postgresql
    restart: unless-stopped

  marple-garage:
    image: dxflrs/garage:v2.1.0
    container_name: marple-garage
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ${COMPOSE_PATH_ROOT}/garage/data:/var/lib/garage/data
      - ${COMPOSE_PATH_ROOT}/garage/meta:/var/lib/garage/meta
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD", "/garage", "status"]
      timeout: 5s
    restart: unless-stopped

  marple-insight:
    container_name: marple-insight
    image: docker.marpledata.com/library/marple-insight:${VERSION_INSIGHT:-3.2.1}
    env_file:
      - .env
    environment:
      MARPLE_DEPLOYMENT: $DEPLOYMENT
      MARPLE_LOG_SHOULD_UPLOAD: $LOG_SHOULD_UPLOAD
      MARPLE_LICENSING_SERVER_ENABLED: $LICENSING_SERVER_ENABLED
      MARPLE_POSTGRES_HOST: $POSTGRES_HOST
      MARPLE_POSTGRES_PORT: $POSTGRES_PORT
      MARPLE_POSTGRES_DB_NAME: $POSTGRES_DB
      MARPLE_POSTGRES_USER: $POSTGRES_USER
      MARPLE_POSTGRES_PW: $POSTGRES_PASSWORD
      MARPLE_AUTH_PROVIDER: $IDP_PROVIDER
      MARPLE_OAUTH_DOMAIN: $OIDC_DOMAIN
      MARPLE_OAUTH_ISSUER: $OIDC_ISSUER
      MARPLE_OAUTH_APP_CLIENT_ID: $OIDC_CLIENT
      MARPLE_OAUTH_API_AUDIENCE: $OIDC_AUDIENCE
      MARPLE_OAUTH_SCOPE: $OIDC_SCOPE
    ports:
      - ${COMPOSE_PORT_INSIGHT:-80}:80 # first port is host
    volumes:
      - ${COMPOSE_PATH_ROOT}/insight:/srv/marple
    depends_on:
      - marple-postgres
    restart: unless-stopped

  marple-db:
    container_name: marple-db
    image: docker.marpledata.com/library/marple-db:${VERSION_DB:-3.8.0}
    # Single-container deployment: run the API server and the workers together.
    command: ["./start.sh", "all"]
    init: true
    env_file:
      - .env
    environment:
      MDB_DEPLOYMENT: $DEPLOYMENT
      MDB_LOG_SHOULD_UPLOAD: $LOG_SHOULD_UPLOAD
      MDB_LICENSING_SERVER_ENABLED: $LICENSING_SERVER_ENABLED
      MDB_DB_HOST: $POSTGRES_HOST
      MDB_DB_PORT: $POSTGRES_PORT
      MDB_DB_NAME: $POSTGRES_DB
      MDB_DB_USER: $POSTGRES_USER
      MDB_DB_PASSWORD: $POSTGRES_PASSWORD
      MDB_IDP_PROVIDER: $IDP_PROVIDER
      MDB_OIDC_DOMAIN: $OIDC_DOMAIN
      MDB_OIDC_CLIENT: $OIDC_CLIENT
      MDB_OIDC_AUDIENCE: $OIDC_AUDIENCE
      MDB_OIDC_SCOPE: $OIDC_SCOPE
    ports:
      - ${COMPOSE_PORT_DB:-8000}:80 # first port is host
    volumes:
      - ${COMPOSE_PATH_ROOT}/db:/srv/marpledb
    depends_on:
      - marple-postgres
      - marple-garage
      - marple-trino
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MDB_CPU_LIMIT:-0}"
          memory: "${MDB_MEM_LIMIT:-0}"

  marple-trino:
    container_name: marple-trino
    # Keep this pinned to the SPI version used by marpledb-trino-auth (see marpledb-trino-auth/pom.xml)
    image: trinodb/trino:479
    ports:
      - ${COMPOSE_PORT_TRINO:-9003}:8080
    environment:
      CATALOG_MANAGEMENT: dynamic
    volumes:
      # Password authenticator config
      - ./trino/config.properties:/etc/trino/config.properties:ro
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${TRINO_CPU_LIMIT:-0}"
          memory: "${TRINO_MEM_LIMIT:-0}"
