# Minimal single-node Trino config for airgap (no password auth).
# Query budget is set via TRINO_QUERY_* env vars from the resource profile.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=dynamic
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
query.max-total-memory=${ENV:TRINO_QUERY_MAX_TOTAL_MEMORY}
memory.heap-headroom-per-node=${ENV:TRINO_HEAP_HEADROOM_PER_NODE}
