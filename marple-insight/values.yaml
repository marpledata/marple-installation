# configuration file for a Marple deployment

# required to pull containers from docker.marpledata.com
imagePullSecrets:
  - name: docker-regcred

# container
image:
  repository: docker.marpledata.com/library/marple-insight
  pullPolicy: IfNotPresent
  # tag will default to .Chart.AppVersion

# container configuration
env:
  - name: MARPLE_POSTGRES_HOST
    value: "TODO"
  - name: MARPLE_POSTGRES_PORT
    value: "5432"
  - name: MARPLE_POSTGRES_USER
    value: "TODO"
  - name: MARPLE_POSTGRES_PW
    value: "TODO"
  - name: MARPLE_POSTGRES_DB_NAME
    value: "marple"
  - name: MARPLE_DEPLOYMENT
    value: "TODO" # Ask Marple team, e.g. Your-company
  - name: MARPLE_PUBLIC_URL
    value: "TODO" # e.g. https://marple.yourcompany.com
  - name: MARPLE_AUTH_PROVIDER
    value: OFFLINE
  - name: MARPLE_OAUTH_DOMAIN
    value: "TODO"
  - name: MARPLE_OAUTH_ISSUER
    value: "TODO"
  - name: MARPLE_OAUTH_API_AUDIENCE
    value: "TODO"
  - name: MARPLE_OAUTH_APP_CLIENT_ID
    value: "TODO"
  - name: MARPLE_OAUTH_SCOPE
    value: "" # Optionally
  - name: MARPLE_OAUTH_GROUP_KEY
    value: "" # Optionally, to assign users to workspaces from IdP
  - name: MARPLE_AUTO_JOIN_WORKSPACE
    value: "false"
  - name: MARPLE_AUTO_CREATE_WORKSPACE
    value: "false"
  - name: MARPLE_SUPERUSER_ID
    value: "" # has to be a sub from your IdP
  - name: MARPLE_SUPERUSER_GROUP
    value: "" # has to be a group from your IdP
  - name: MARPLE_POSTMARK_SEND_MAIL
    value: true # send emails on user invites
  - name: MARPLE_AI_API_KEY
    value: "" # Optional, enables AI plot generation
  - name: MARPLE_AI_BASE_URL
    value: "https://api.openai.com/v1"
  - name: MARPLE_AI_MODEL
    value: "gpt-4o-mini"
  - name: MARPLE_API_WORKERS
    value: "4" # 0 = auto (2*CPU+1). Profile hints: small=2, medium=3, large=5
  - name: MARPLE_PROCRASTINATE_WORKERS
    value: "4" # queue export concurrency. Profile hints: small=2, medium=3, large=5

# API pod sizing (nginx + gunicorn)
api:
  requests:
    memory: "4Gi"
    # cpu omitted = no CPU request
  limits:
    memory: "4Gi"
    # cpu omitted = no CPU limit

# queue worker pod (background exports and maintenance jobs)
queue:
  resources:
    requests:
      memory: "4Gi"
    limits:
      memory: "4Gi"

# Helm/K8s only: Playwright export URL for the queue pod (figure PNGs, report PDFs).
# The queue pod cannot use localhost; it must reach the API via the cluster Service.
# Leave empty to default to http://<release>-marple (requires service.enabled: true).
# Docker Compose deployments do not need this (queue shares the API network namespace).
export:
  serverUrl: ""

# persistent volume to store files
volume:
  storage: 20Gi
  className: managed-csi
  hostPath: false

# API Service (ClusterIP, internal only). Required for queue pod exports (Playwright
# reaches the API at http://<release>-marple). External access still uses Ingress
# or set type to NodePort/LoadBalancer.
service:
  enabled: true
  # Service type: ClusterIP (internal), NodePort (limited external), LoadBalancer (full external)
  type: ClusterIP
  # NodePort for NodePort service type (default: 30080)
  nodePort: 30080
  # Annotations for service (useful for cloud provider specific settings)
  annotations:
    {}
    # Example for Azure internal LoadBalancer:
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    # service.beta.kubernetes.io/azure-load-balancer-sku: "Standard"
