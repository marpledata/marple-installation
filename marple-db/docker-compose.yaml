# Resource limits and worker counts come from .env; append a profile from
# ../profiles/ when creating .env (see .env.example and ../profiles/README.md).
services:
  marple-db:
    container_name: $MDB_CONTAINER_NAME
    image: docker.marpledata.com/library/marple-db:$MDB_VERSION
    command: ["./start.sh", "web"]
    init: true
    env_file:
      - .env
    ports:
      - $MDB_PORT:80
    volumes:
      - $DOCKER_PATH_ROOT:/srv/marpledb
      - $DOCKER_PATH_ROOT/.usage-automation.json:/etc/marple/.usage-automation.json
    # start_period covers prepare + Trino boot (in-app wait up to 5 min).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MDB_CPU_LIMIT:-0}"
          memory: "${MDB_MEM_LIMIT:-0}"

  marple-db-worker:
    container_name: ${MDB_WORKER_CONTAINER_NAME:-marple-db-worker}
    image: docker.marpledata.com/library/marple-db:$MDB_VERSION
    command: ["./start.sh", "worker"]
    init: true
    env_file:
      - .env
    # Must see the same uploads / scratch / trino config as the web container.
    volumes:
      - $DOCKER_PATH_ROOT:/srv/marpledb
    depends_on:
      marple-db:
        condition: service_healthy
      trino:
        condition: service_started
    restart: unless-stopped
    deploy:
      # The queue startup-reset assumes one worker process per queue; do not scale this out.
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${MDB_WORKER_CPU_LIMIT:-0}"
          memory: "${MDB_WORKER_MEM_LIMIT:-0}"

  trino:
    container_name: $TRINO_CONTAINER_NAME
    image: trinodb/trino:479
    env_file:
      - .env
    # service_started only — healthy would deadlock (API waits on Trino during boot).
    depends_on:
      marple-db:
        condition: service_started
    ports:
      - "$TRINO_PORT:8080"
    volumes:
      - $DOCKER_PATH_ROOT/swap/trino/etc:/etc/trino
      - $DOCKER_PATH_ROOT/swap/trino/plugin:/usr/lib/trino/plugin/marpledb:ro
      - $DOCKER_PATH_ROOT/swap/trino/spill:/data/spill
    restart: unless-stopped
    deploy:
      resources:
        # Unlimited by default; set the *_LIMIT vars in .env to cap (see .env.example for hints).
        limits:
          cpus: "${TRINO_CPU_LIMIT:-0}"
          memory: "${TRINO_MEM_LIMIT:-0}"
