 services:
  marpledb:
    container_name: $MDB_CONTAINER_NAME
    image: docker.marpledata.com/library/marpledb:$MDB_VERSION
    env_file:
      - .env
    ports:
      - $MDB_PORT:80
    volumes:
      - $DOCKER_PATH_ROOT:/srv/marpledb
    healthcheck:
      # prepare_config writes this first, before the slow schema-init/upgrade,
      # so trino can start as soon as etc/, plugin/ and the spill dir exist.
      test: ["CMD", "test", "-f", "/srv/marpledb/trino/etc/config.properties"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  trino:
    container_name: $TRINO_CONTAINER_NAME
    image: trinodb/trino:479
    env_file:
      - .env
    depends_on:
      marpledb:
        condition: service_healthy
    ports:
      - "$TRINO_PORT:8080"
    volumes:
      - $DOCKER_PATH_ROOT/trino/etc:/etc/trino
      - $DOCKER_PATH_ROOT/trino/plugin:/usr/lib/trino/plugin/marpledb:ro
      - $DOCKER_PATH_ROOT/swap/trino:/data/spill
    restart: unless-stopped 
    deploy:
      resources:
        limits:
          cpus: "2.5"  # Set to +- 70% of available CPU cores
