  marple-insight:
    container_name: marple-insight
    image: docker.marpledata.com/library/marple-insight:${VERSION_INSIGHT:-1.21.1}
    env_file:
      - .env
    environment:
      MARPLE_DEPLOYMENT: $DEPLOYMENT
      MARPLE_LOG_SHOULD_UPLOAD: $LOG_SHOULD_UPLOAD
      MARPLE_LICENSING_SERVER_ENABLED: $LICENSING_SERVER_ENABLED
      MARPLE_POSTGRES_HOST: $POSTGRES_HOST
      MARPLE_POSTGRES_PORT: $POSTGRES_PORT
      MARPLE_POSTGRES_DB_NAME: $POSTGRES_DATABASE
      MARPLE_POSTGRES_USER: $POSTGRES_USER
      MARPLE_POSTGRES_PW: $POSTGRES_PASSWORD
      MARPLE_AUTH_PROVIDER: $IDP_PROVIDER
      MARPLE_OAUTH_DOMAIN: $OIDC_DOMAIN
      MARPLE_OAUTH_ISSUER: $OIDC_ISSUER
      MARPLE_OAUTH_APP_CLIENT_ID: $OIDC_CLIENT
      MARPLE_OAUTH_API_AUDIENCE: $OIDC_AUDIENCE
      MARPLE_OAUTH_SCOPE: $OIDC_SCOPE
    ports:
      - ${COMPOSE_PORT_INSIGHT:-80}:80 # first port is host
    volumes:
      - ${COMPOSE_PATH_ROOT}/insight:/srv/marple
    depends_on:
      - postgres
    restart: unless-stopped

  marple-db:
    container_name: marple-db
    image: docker.marpledata.com/library/marpledb:${VERSION_DB:-2.11.1}
    env_file:
      - .env
    environment:
      MDB_DEPLOYMENT: $DEPLOYMENT
      MDB_LOG_SHOULD_UPLOAD: $LOG_SHOULD_UPLOAD
      MDB_LICENSING_SERVER_ENABLED: $LICENSING_SERVER_ENABLED
      MDB_DB_HOST: $POSTGRES_HOST
      MDB_DB_PORT: $POSTGRES_PORT
      MDB_DB_NAME: $POSTGRES_DATABASE
      MDB_DB_USER: $POSTGRES_USER
      MDB_DB_PASSWORD: $POSTGRES_PASSWORD
      MDB_IDP_PROVIDER: $IDP_PROVIDER
      MDB_OIDC_DOMAIN: $OIDC_DOMAIN
      MDB_OIDC_CLIENT: $OIDC_CLIENT
      MDB_OIDC_AUDIENCE: $OIDC_AUDIENCE
      MDB_OIDC_SCOPE: $OIDC_SCOPE
    ports:
      - ${COMPOSE_PORT_DB:-8000}:80 # first port is host
    volumes:
      - ${COMPOSE_PATH_ROOT}/db:/srv/marpledb
      - ./trino/etc/rules.json:$MDB_TRINO_PATH_RULES
    depends_on:
      - postgres
      - garage
      - trino
    restart: unless-stopped

  trino:
    container_name: marple-trino
    # Keep this pinned to the SPI version used by marpledb-trino-auth (see marpledb-trino-auth/pom.xml)
    image: trinodb/trino:479
    ports:
      - ${COMPOSE_PORT_TRINO:-9003}:8080
    env_file:
      - .env
    environment:
      CATALOG_MANAGEMENT: dynamic
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/marpledb-trino-auth-0.1.0.jar:/usr/lib/trino/plugin/marpledb/marpledb-trino-auth-0.1.0.jar:ro
      - ${COMPOSE_PATH_ROOT}/swap/trino:/data/spill
    restart: unless-stopped
