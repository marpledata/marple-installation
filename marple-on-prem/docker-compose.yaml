services:
  postgres:
    container_name: marple-postgres
    env_file:
      - .env
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DATABASE} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:18-alpine
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - ${COMPOSE_PATH_ROOT}/postgres:/var/lib/postgresql
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: marple-garage
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ${COMPOSE_PATH_ROOT}/garage/data:/var/lib/garage/data
      - ${COMPOSE_PATH_ROOT}/garage/meta:/var/lib/garage/meta
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD", "/garage", "status"]
      timeout: 5s
    restart: unless-stopped

  dex:
    image: dexidp/dex:v2.44.0-alpine
    container_name: marple-dex
    ports:
      - ${COMPOSE_PORT_IDP:-8080}:8080
    volumes:
      - ./idp/dex-config.yaml:/etc/dex/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    restart: unless-stopped

